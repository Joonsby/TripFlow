services:
  mysql:
    image: mysql:8.0
    container_name: tripflow-mysql-prod
    restart: unless-stopped

    ports:
      - "127.0.0.1:3308:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    volumes:
      - tripflow_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -uroot -p"$${MYSQL_ROOT_PASSWORD}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  backend:
    build: .
    container_name: tripflow-backend-prod
    restart: unless-stopped

    ports:
      - "127.0.0.1:8081:8080"

    environment:
      SPRING_PROFILES_ACTIVE: prod

      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-30}
      JWT_REFRESH_TOKEN_DAYS: ${JWT_REFRESH_TOKEN_DAYS:-14}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}

      NTS_BUSINESS_API_KEY: ${NTS_BUSINESS_API_KEY}

    depends_on:
      mysql:
        condition: service_healthy


volumes:
  tripflow_mysql_data: