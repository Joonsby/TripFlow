name: Deploy TripFlow Backend

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: tripflow-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout backend only
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            backend
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Sync backend source
        run: |
          set -euo pipefail

          DEPLOY_DIR="/home/joonsby/apps/TripFlow/backend"

          mkdir -p "$DEPLOY_DIR"

          rsync -av --delete \
            --exclude='.env' \
            --exclude='.env.*' \
            backend/ \
            "$DEPLOY_DIR/"

      - name: Validate production configuration
        working-directory: /home/joonsby/apps/TripFlow/backend
        run: |
          set -euo pipefail

          docker compose \
            --project-directory /home/joonsby/apps/TripFlow/backend \
            --env-file /home/joonsby/secrets/tripflow.env \
            -f /home/joonsby/apps/TripFlow/backend/docker-compose.prod.yml \
            config --quiet

      - name: Deploy MySQL and backend
        working-directory: /home/joonsby/apps/TripFlow/backend
        run: |
          set -euo pipefail

          docker compose \
            --project-directory /home/joonsby/apps/TripFlow/backend \
            --env-file /home/joonsby/secrets/tripflow.env \
            -f /home/joonsby/apps/TripFlow/backend/docker-compose.prod.yml \
            up -d --build mysql backend

      - name: Wait for backend
        working-directory: /home/joonsby/apps/TripFlow/backend
        run: |
          set -euo pipefail

          COMPOSE_CMD=(
            docker compose
            --project-directory /home/joonsby/apps/TripFlow/backend
            --env-file /home/joonsby/secrets/tripflow.env
            -f /home/joonsby/apps/TripFlow/backend/docker-compose.prod.yml
          )

          for i in $(seq 1 40); do
            container_status="$(
              docker inspect \
                --format='{{.State.Status}}' \
                tripflow-backend-prod 2>/dev/null || true
            )"

            echo "Attempt $i/40 - backend status: $container_status"

            if [ "$container_status" = "running" ] && \
               "${COMPOSE_CMD[@]}" logs --no-color backend \
                 | grep -q "Started TripFlowBackendApplication"; then
              echo "Backend is ready."
              exit 0
            fi

            if [ "$container_status" = "exited" ] || \
               [ "$container_status" = "dead" ] || \
               [ "$container_status" = "restarting" ]; then
              echo "Backend failed to start."
              "${COMPOSE_CMD[@]}" logs --tail=200 backend
              exit 1
            fi

            sleep 3
          done

          echo "Backend startup timed out."
          "${COMPOSE_CMD[@]}" logs --tail=200 backend
          exit 1

      - name: Verify local backend endpoint
        run: |
          set -euo pipefail

          for i in $(seq 1 20); do
            status_code="$(
              curl \
                --silent \
                --show-error \
                --output /dev/null \
                --write-out '%{http_code}' \
                http://127.0.0.1:8081/ \
                || true
            )"

            echo "Attempt $i/20 - local HTTP status: $status_code"

            case "$status_code" in
              200|201|204|301|302|400|401|403|404)
                echo "Local backend is reachable."
                exit 0
                ;;
            esac

            sleep 3
          done

          echo "Local backend verification failed."
          exit 1

      - name: Verify HTTPS endpoint
        run: |
          set -euo pipefail

          for i in $(seq 1 20); do
            status_code="$(
              curl \
                --silent \
                --show-error \
                --output /dev/null \
                --write-out '%{http_code}' \
                https://tripflow.fit-plate.com/ \
                || true
            )"

            echo "Attempt $i/20 - HTTPS status: $status_code"

            case "$status_code" in
              200|201|204|301|302|400|401|403|404)
                echo "HTTPS endpoint is reachable."
                exit 0
                ;;
            esac

            sleep 3
          done

          echo "HTTPS endpoint verification failed."
          exit 1

      - name: Show container status
        working-directory: /home/joonsby/apps/TripFlow/backend
        run: |
          docker compose \
            --project-directory /home/joonsby/apps/TripFlow/backend \
            --env-file /home/joonsby/secrets/tripflow.env \
            -f /home/joonsby/apps/TripFlow/backend/docker-compose.prod.yml \
            ps

      - name: Show logs on failure
        if: failure()
        working-directory: /home/joonsby/apps/TripFlow/backend
        run: |
          docker compose \
            --project-directory /home/joonsby/apps/TripFlow/backend \
            --env-file /home/joonsby/secrets/tripflow.env \
            -f /home/joonsby/apps/TripFlow/backend/docker-compose.prod.yml \
            ps

          docker compose \
            --project-directory /home/joonsby/apps/TripFlow/backend \
            --env-file /home/joonsby/secrets/tripflow.env \
            -f /home/joonsby/apps/TripFlow/backend/docker-compose.prod.yml \
            logs --tail=200 mysql backend